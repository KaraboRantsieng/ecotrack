name: Publish EcoTrack Android v1.0.4

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/publish-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release staging files
        uses: actions/checkout@v4
      - name: Reassemble and verify the release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cat .release-staging/v1.0.4/part-*.b64 | base64 --decode > release/EcoTrack-Android-v1.0.4.zip
          echo "eb8e55cf3194bf464465f8aa662edbd0de79f5dc5ee189838c1104a6b930e106  release/EcoTrack-Android-v1.0.4.zip" | sha256sum --check
          unzip -t release/EcoTrack-Android-v1.0.4.zip
          unzip -j release/EcoTrack-Android-v1.0.4.zip EcoTrack-Android-v1.0.4.apk -d release
          echo "5a85c7fe575f6ada415b28ed33a17fbe70293471e47d9de47ed33c6b517e698b  release/EcoTrack-Android-v1.0.4.apk" | sha256sum --check
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.0.4 \
            --repo "${{ github.repository }}" \
            --title "EcoTrack Android v1.0.4" \
            --notes "Signed Android release. APK SHA-256: 5a85c7fe575f6ada415b28ed33a17fbe70293471e47d9de47ed33c6b517e698b. Existing users of the previous v8 APK must uninstall it before installing this version because the signing certificate changed. Server-hosted Base44 web changes will update without reinstalling the APK; native Android changes still require a new APK."
